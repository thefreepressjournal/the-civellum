 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Civellum: independent student journalism covering economics, technology and culture.">
  <title>The Civellum | Independent Journalism</title>

  <style>
    :root {
      --paper: #fcfaf6;
      --ink: #202020;
      --muted: #777;
      --line: #dad7d1;
      --accent: #8b2f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    a { color: inherit; }

    .container {
      max-width: 1080px;
      margin: auto;
      padding: 0 20px;
    }

    header {
      text-align: center;
      padding: 30px 0 15px;
      border-bottom: 3px double var(--ink);
    }

    .kicker {
      font: 11px Arial, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .masthead {
      font-size: clamp(36px, 8vw, 76px);
      font-weight: bold;
      letter-spacing: -3px;
      margin: 8px 0;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      font: bold 12px Arial, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav a { text-decoration: none; }

    nav a:hover,
    nav a.active { color: var(--accent); }

    main { min-height: 55vh; }
    section { padding: 32px 0; }

    h1, h2, h3, p { margin-top: 0; }

    h1 { font-size: clamp(28px, 4vw, 48px); }
    h2 { font-size: 28px; }

    .hero {
      padding: 45px 0;
      border-bottom: 1px solid var(--line);
    }

    .hero h1 {
      max-width: 820px;
      line-height: 1.08;
      margin: 12px 0 16px;
    }

    .hero p {
      max-width: 650px;
      line-height: 1.6;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      background: var(--ink);
      color: white;
      border: 0;
      text-decoration: none;
      cursor: pointer;
      font: bold 13px Arial, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    article {
      padding: 18px 0;
      border-top: 2px solid var(--ink);
    }

    article h3 {
      font-size: 24px;
      line-height: 1.2;
      margin: 12px 0;
    }

    article p {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
    }

    .meta {
      font: 12px Arial, sans-serif;
      color: var(--muted);
    }

    .panel {
      max-width: 740px;
      padding: 32px 0;
    }

    .panel p {
      font-size: 18px;
      line-height: 1.7;
    }

    .article-body {
      max-width: 730px;
      margin: auto;
      font-size: 19px;
      line-height: 1.8;
    }

    .article-body .back {
      font: 13px Arial, sans-serif;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 26px;
    }

    .filter {
      background: transparent;
      border: 1px solid var(--line);
      padding: 9px 12px;
      cursor: pointer;
      font: 13px Arial, sans-serif;
    }

    .filter.active {
      background: var(--ink);
      color: white;
    }

    .contact-form {
      display: grid;
      gap: 16px;
      max-width: 650px;
      margin-top: 24px;
    }

    .contact-form label {
      display: grid;
      gap: 7px;
      font: bold 13px Arial, sans-serif;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      font: 16px Arial, sans-serif;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      color: var(--ink);
    }

    .contact-form textarea {
      min-height: 145px;
      resize: vertical;
    }

    .contact-form .button {
      justify-self: start;
      margin-top: 0;
    }

    footer {
      border-top: 3px double var(--ink);
      padding: 26px 0 35px;
      font: 12px Arial, sans-serif;
      color: #666;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    @media (max-width: 750px) {
      .grid { grid-template-columns: 1fr; }
      .masthead { letter-spacing: -1px; }
      nav { gap: 12px; }
      .hero { padding: 30px 0; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="kicker">Independent Student Journalism</div>
      <div class="masthead">THE CIVELLUM</div>
      <div class="kicker">
        Technology · Economics · Culture
      </div>
    </header>

    <nav aria-label="Main navigation">
      <a href="#home" data-nav="home">Home</a>
      <a href="#articles" data-nav="articles">Articles</a>
      <a href="#about" data-nav="about">About</a>
      <a href="#contact" data-nav="contact">Contact</a>
    </nav>

    <main id="app"></main>

    <footer>
      <span>
        © <span id="year"></span> The Civellum.
        Independent Student Journalism.
      </span>
      <span>
        Demo articles will be replaced with original reporting.
      </span>
    </footer>

  </div>

  <script>

    // =====================================
    // ARTICLES
    // Add your own articles here.
    // =====================================

    const articles = [
      {
        id: "ai-decisions",
        category: "Technology",
        date: "Sample article",
        title: "Who Is Responsible When AI Makes a Decision?",
        summary: "Exploring the questions surrounding automated decision-making.",
        body: [
          "This is a demonstration article. It will be replaced with original reporting.",
          "Future articles will include research, reliable sources and independent analysis."
        ]
      },

      {
        id: "young-economy",
        category: "Economics",
        date: "Sample article",
        title: "Understanding the Economy Starts with Asking Better Questions",
        summary: "An introduction to researching economic challenges.",
        body: [
          "This is a sample article for the newspaper's initial design."
        ]
      },

      {
        id: "art-future",
        category: "Culture",
        date: "Sample article",
        title: "Why Artistic Creation Still Matters",
        summary: "Exploring creativity, education and culture.",
        body: [
          "This article is a design placeholder awaiting original content."
        ]
      }
    ];

    const app = document.getElementById("app");

    // Prevent article text from being interpreted as HTML.
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function articleCard(article) {
      return `
        <article>
          <div class="kicker">
            ${escapeHtml(article.category)}
          </div>

          <h3>
            <a href="#read/${encodeURIComponent(article.id)}">
              ${escapeHtml(article.title)}
            </a>
          </h3>

          <p>${escapeHtml(article.summary)}</p>

          <div class="meta">
            ${escapeHtml(article.date)}
          </div>
        </article>
      `;
    }

    function render() {
      const route = decodeURIComponent(
        window.location.hash.substring(1)
      ) || "home";

      document.querySelectorAll("[data-nav]").forEach(link => {
        link.classList.toggle(
          "active",
          link.dataset.nav === route
        );
      });

      // HOME
      if (route === "home") {
        app.innerHTML = `
          <section class="hero">
            <div class="kicker">
              Independent Journalism
            </div>

            <h1>
              Understanding the world beyond the headlines.
            </h1>

            <p>
              The Civellum is an independent student-led
              publication exploring economics, technology,
              culture and the ideas shaping tomorrow.
            </p>

            <a class="button" href="#articles">
              Explore Articles →
            </a>
          </section>

          <section>
            <div class="kicker">Our Publication</div>
            <h2>Latest Articles</h2>

            <div class="grid">
              ${articles.map(articleCard).join("")}
            </div>
          </section>
        `;
      }

      // ARTICLES
      else if (route === "articles") {
        app.innerHTML = `
          <section>
            <h1>Articles</h1>
            <p>Explore our latest publications.</p>

            <div class="toolbar" id="filters"></div>
            <div class="grid" id="cards"></div>
          </section>
        `;

        const filters = [
          "All",
          ...new Set(articles.map(a => a.category))
        ];

        const filterBox = document.getElementById("filters");
        const cardsBox = document.getElementById("cards");

        function applyFilter(selected) {
          filterBox.innerHTML = filters.map(f => `
            <button
              class="filter ${f === selected ? "active" : ""}"
              data-filter="${escapeHtml(f)}">
              ${escapeHtml(f)}
            </button>
          `).join("");

          cardsBox.innerHTML = articles
            .filter(a =>
              selected === "All" || a.category === selected
            )
            .map(articleCard)
            .join("");

          filterBox.querySelectorAll("button").forEach(b => {
            b.addEventListener("click", () => {
              applyFilter(b.dataset.filter);
            });
          });
        }

        applyFilter("All");
      }

      // ABOUT
      else if (route === "about") {
        app.innerHTML = `
          <section class="panel">
            <div class="kicker">Our Mission</div>
            <h1>About The Civellum</h1>

            <p>
              The Civellum is an independent student-led
              digital newspaper dedicated to thoughtful,
              evidence-based journalism.
            </p>

            <p>
              Our editorial interests include economics,
              technology, culture and society.
            </p>

            <p>
              The publication is currently being developed
              by its founder, with plans to welcome
              contributors in the future.
            </p>
          </section>
        `;
      }

      // CONTACT
      else if (route === "contact") {
        app.innerHTML = `
          <section class="panel">

            <div class="kicker">Get in Touch</div>
            <h1>Contact The Civellum</h1>

            <p>
              Have a story idea, a correction, or an interest
              in contributing? Send us a message.
            </p>

            <form
              class="contact-form"
              action="https://formsubmit.co/valcorasara@gmail.com"
              method="POST">

              <input
                type="hidden"
                name="_next"
                value="https://thefreepressjournal.github.io/the-civellum/">

              <input
                type="hidden"
                name="_subject"
                value="The Civellum - New Contact Message">

              <input
                type="hidden"
                name="_template"
                value="table">

              <input
                type="text"
                name="_honey"
                style="display:none"
                tabindex="-1"
                autocomplete="off"
                aria-hidden="true">

              <label>
                Your Name
                <input
                  type="text"
                  name="name"
                  maxlength="120"
                  placeholder="Your name"
                  required>
              </label>

              <label>
                Your Email
                <input
                  type="email"
                  name="email"
                  maxlength="254"
                  placeholder="you@example.com"
                  required>
              </label>

              <label>
                Reason for Contact
                <select name="topic" required>
                  <option value="" disabled selected>
                    Select a topic
                  </option>

                  <option value="Story Pitch">
                    Story Pitch
                  </option>

                  <option value="Join the Team">
                    Join the Team
                  </option>

                  <option value="Correction">
                    Correction
                  </option>

                  <option value="General Message">
                    General Message
                  </option>
                </select>
              </label>

              <label>
                Your Message
                <textarea
                  name="message"
                  maxlength="10000"
                  placeholder="Write your message here..."
                  required></textarea>
              </label>

              <button type="submit" class="button">
                Send Message →
              </button>

            </form>

            <p class="meta" style="margin-top:22px">
              Messages are processed by FormSubmit.
              Please do not share passwords or sensitive
              personal information.
            </p>

          </section>
        `;
      }

      // READ ARTICLE
      else if (route.startsWith("read/")) {
        const id = route.substring(5);
        const article = articles.find(a => a.id === id);

        if (article) {
          app.innerHTML = `
            <section class="article-body">

              <a class="back" href="#articles">
                ← Back to Articles
              </a>

              <p class="kicker" style="margin-top:30px">
                ${escapeHtml(article.category)}
                · ${escapeHtml(article.date)}
              </p>

              <h1>${escapeHtml(article.title)}</h1>

              <p class="lead">
                ${escapeHtml(article.summary)}
              </p>

              <hr>

              ${article.body.map(p =>
                `<p>${escapeHtml(p)}</p>`
              ).join("")}

            </section>
          `;
        } else {
          app.innerHTML = `
            <section>
              <h1>Article Not Found</h1>
              <a href="#articles">Return to Articles</a>
            </section>
          `;
        }
      }

      // NOT FOUND
      else {
        app.innerHTML = `
          <section>
            <h1>Page Not Found</h1>
            <a href="#home">Return Home</a>
          </section>
        `;
      }

      window.scrollTo(0, 0);
    }

    document.getElementById("year").textContent =
      new Date().getFullYear();

    window.addEventListener("hashchange", render);

    render();

  </script>
</body>
</html>
