
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Civellum, un periódico independiente sobre economía, tecnología y cultura.">
  <title>The Civellum | Independent Student Journalism</title>

  <style>
    :root {
      --ink: #202020;
      --muted: #777;
      --line: #dad7d1;
      --paper: #fcfaf6;
      --accent: #8b2f2f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
    }

    a { color: inherit; }

    .container {
      max-width: 1080px;
      margin: auto;
      padding: 0 20px;
    }

    .kicker {
      font: 11px Arial, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    header {
      text-align: center;
      padding: 30px 0 15px;
      border-bottom: 3px double var(--ink);
    }

    .masthead {
      font-size: clamp(36px, 8vw, 76px);
      font-weight: 700;
      letter-spacing: -3px;
      margin: 8px 0;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      font: 600 12px Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a { text-decoration: none; }

    nav a:hover,
    nav a.active { color: var(--accent); }

    main { min-height: 55vh; }
    section { padding: 32px 0; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(28px, 4vw, 48px); }
    h2 { font-size: 28px; }

    .lead {
      font-size: 20px;
      line-height: 1.55;
      max-width: 720px;
    }

    .hero {
      border-bottom: 1px solid var(--line);
      padding: 45px 0;
    }

    .hero h1 {
      max-width: 820px;
      line-height: 1.06;
      margin: 12px 0 16px;
    }

    .hero p {
      max-width: 650px;
      line-height: 1.55;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      background: var(--ink);
      color: white;
      border: 0;
      text-decoration: none;
      font: 600 13px Arial, sans-serif;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0 26px;
    }

    .filter {
      background: transparent;
      border: 1px solid var(--line);
      padding: 9px 12px;
      cursor: pointer;
      font: 13px Arial, sans-serif;
    }

    .filter.active {
      background: var(--ink);
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    article {
      padding: 18px 0;
      border-top: 2px solid var(--ink);
    }

    article h3 {
      font-size: 24px;
      line-height: 1.2;
      margin: 12px 0;
    }

    article p {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
    }

    .meta {
      font: 12px Arial, sans-serif;
      color: var(--muted);
    }

    .article-body {
      max-width: 730px;
      margin: auto;
      font-size: 19px;
      line-height: 1.8;
    }

    .article-body h1 { line-height: 1.1; }
    .article-body .back { font: 13px Arial, sans-serif; }

    .panel {
      max-width: 740px;
      padding: 32px 0;
    }

    .panel p {
      line-height: 1.7;
      font-size: 18px;
    }

    footer {
      border-top: 3px double var(--ink);
      padding: 26px 0 35px;
      font: 12px Arial, sans-serif;
      color: #666;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .contact-form {
      display: grid;
      gap: 16px;
      max-width: 650px;
      margin-top: 24px;
    }

    .contact-form label {
      display: grid;
      gap: 7px;
      font: 600 13px Arial, sans-serif;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      font: 16px Arial, sans-serif;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      background: white;
    }

    .contact-form textarea {
      min-height: 145px;
      resize: vertical;
    }

    .contact-form .button {
      justify-self: start;
      margin-top: 0;
    }

    @media (max-width: 750px) {
      .grid { grid-template-columns: 1fr; }
      .masthead { letter-spacing: -1px; }
      nav { gap: 12px; }
      .hero { padding: 30px 0; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div class="kicker">Independent Student Journalism</div>
      <div class="masthead">THE CIVELLUM</div>
      <div class="kicker">Technology · Economics · Culture</div>
    </header>

    <nav aria-label="Navegación principal">
      <a href="#inicio" data-nav="inicio">Inicio</a>
      <a href="#articulos" data-nav="articulos">Artículos</a>
      <a href="#sobre" data-nav="sobre">Sobre el proyecto</a>
      <a href="#contacto" data-nav="contacto">Contacto</a>
    </nav>

    <main id="app"></main>

    <footer>
      <span>© <span id="year"></span> The Civellum. Proyecto editorial independiente.</span>
      <span>Los artículos de ejemplo se sustituirán por publicaciones originales.</span>
    </footer>

  </div>

  <script>

    // AQUÍ PUEDES MODIFICAR O AÑADIR ARTÍCULOS

    const articles = [
      {
        id: 'ia-decisiones',
        category: 'Tecnología',
        date: 'Ejemplo de contenido',
        title: '¿Quién debe responder por las decisiones de una IA?',
        summary: 'Una guía de las preguntas que deberíamos plantearnos antes de confiar en sistemas automatizados.',
        body: [
          'Este texto es una demostración de diseño. Sustitúyelo por un artículo original.',
          'Antes de publicar, consulta fuentes fiables y separa hechos de opiniones.'
        ]
      },
      {
        id: 'economia-joven',
        category: 'Economía',
        date: 'Ejemplo de contenido',
        title: 'Entender la economía empieza con hacer buenas preguntas',
        summary: 'Cómo investigar los problemas económicos de nuestra generación.',
        body: [
          'Este es un texto de muestra, no un reportaje publicado.'
        ]
      },
      {
        id: 'arte-futuro',
        category: 'Cultura',
        date: 'Ejemplo de contenido',
        title: 'Por qué sigue importando la creación artística',
        summary: 'Una mirada a la creatividad y la formación cultural.',
        body: [
          'Esta página demuestra cómo se vería una publicación completa.'
        ]
      }
    ];

    const app = document.getElementById('app');

    const escapeHtml = s =>
      String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));

    const card = a => `
      <article>
        <div class="kicker">${escapeHtml(a.category)}</div>
        <h3>
          <a href="#leer/${encodeURIComponent(a.id)}">
            ${escapeHtml(a.title)}
          </a>
        </h3>
        <p>${escapeHtml(a.summary)}</p>
        <div class="meta">${escapeHtml(a.date)}</div>
      </article>
    `;

    function render() {
      const route = decodeURIComponent(location.hash.slice(1)) || 'inicio';

      document.querySelectorAll('[data-nav]').forEach(a => {
        a.classList.toggle('active', route === a.dataset.nav);
      });

      if (route === 'inicio') {
        app.innerHTML = `
          <section class="hero">
            <div class="kicker">Portada · Ideas que importan</div>
            <h1>Un lugar para entender el mundo, no solo leer titulares.</h1>
            <p>
              Un proyecto editorial independiente sobre tecnología,
              economía y cultura. Investigamos, preguntamos y explicamos.
            </p>
            <a class="button" href="#articulos">Leer artículos →</a>
          </section>

          <section>
            <div class="kicker">Edición de muestra</div>
            <h2>Últimos artículos</h2>
            <div class="grid">
              ${articles.map(card).join('')}
            </div>
          </section>
        `;
      }

      else if (route === 'articulos') {
        app.innerHTML = `
          <section>
            <h1>Artículos</h1>
            <p>Explora nuestras secciones.</p>
            <div class="toolbar" id="filters"></div>
            <div id="cards" class="grid"></div>
          </section>
        `;

        const filters = [
          'Todos',
          ...new Set(articles.map(a => a.category))
        ];

        const btnBox = document.getElementById('filters');
        const cards = document.getElementById('cards');

        function apply(selected) {
          btnBox.innerHTML = filters.map(f => `
            <button
              class="filter ${f === selected ? 'active' : ''}"
              data-filter="${escapeHtml(f)}">
              ${escapeHtml(f)}
            </button>
          `).join('');

          cards.innerHTML = articles
            .filter(a => selected === 'Todos' || a.category === selected)
            .map(card)
            .join('');

          btnBox.querySelectorAll('button').forEach(b => {
            b.addEventListener('click', () => apply(b.dataset.filter));
          });
        }

        apply('Todos');
      }

      else if (route === 'sobre') {
        app.innerHTML = `
          <section class="panel">
            <div class="kicker">Nuestra misión</div>
            <h1>Sobre el proyecto</h1>
            <p>
              The Civellum es un proyecto de periodismo juvenil independiente.
              Queremos publicar explicaciones claras, análisis basados en pruebas
              y entrevistas originales.
            </p>
            <p>
              Actualmente el proyecto está en construcción y lo dirige
              una sola persona. Nuestro objetivo es publicar con rigor
              y sumar colaboradores.
            </p>
          </section>
        `;
      }

      else if (route === 'contacto') {
        app.innerHTML = `
          <section class="panel">
            <div class="kicker">Get in touch</div>
            <h1>Contact The Civellum</h1>

            <p>
              Have a story idea, a correction, or an interest in contributing?
              Send the editorial team a message.
            </p>

            <form
              class="contact-form"
              action="https://formsubmit.co/valcorasara@gmail.com"
              method="POST">

             
              <input
                type="hidden"
                
<input type="hidden" name="_next" value="https://thefreepressjournal.github.io/the-civellum/#contacto">

                id="contact-return-url">

              <input
                type="hidden"
              <input
                type="hidden"
                name="_subject"
                value="The Civellum - New contact message">

              <input
                type="hidden"
                name="_template"
                value="table">

              <input
                type="text"
                name="_honey"
                style="display:none"
                tabindex="-1"
                autocomplete="off"
                aria-hidden="true">

              <label>
                Your name or pen name
                <input
                  name="name"
                  maxlength="120"
                  required
                  placeholder="Your name">
              </label>

              <label>
                Your email
                <input
                  type="email"
                  name="email"
                  maxlength="254"
                  required
                  placeholder="you@example.com">
              </label>

              <label>
                Reason for contacting us
                <select name="topic" required>
                  <option value="" selected disabled>
                    Select a topic
                  </option>
                  <option value="Story pitch">Story pitch</option>
                  <option value="Join the team">Join the team</option>
                  <option value="Correction">Correction</option>
                  <option value="General message">General message</option>
                </select>
              </label>

              <label>
                Message
                <textarea
                  name="message"
                  maxlength="10000"
                  required
                  placeholder="Write your message here..."></textarea>
              </label>

              <button class="button" type="submit">
                Send message →
              </button>
            </form>

            <p class="meta" style="margin-top:22px">
              Messages are processed by FormSubmit and forwarded
              to our editorial inbox. Please do not include
              passwords or sensitive personal information.
            </p>
          </section>
        `;
      }

      else if (route.startsWith('leer/')) {
        const a = articles.find(a => a.id === route.slice(5));

        app.innerHTML = a ? `
          <section class="article-body">
            <a class="back" href="#articulos">
              ← Todos los artículos
            </a>

            <p class="kicker" style="margin-top:30px">
              ${escapeHtml(a.category)} · ${escapeHtml(a.date)}
            </p>

            <h1>${escapeHtml(a.title)}</h1>
            <p class="lead">${escapeHtml(a.summary)}</p>
            <hr>

            ${a.body.map(p => `
              <p>${escapeHtml(p)}</p>
            `).join('')}
          </section>
        ` : `
          <section>
            <h1>No se encontró el artículo</h1>
            <a href="#articulos">Volver</a>
          </section>
        `;
      }

      else {
        app.innerHTML = `
          <section>
            <h1>Página no encontrada</h1>
            <a href="#inicio">Volver al inicio</a>
          </section>
        `;
      }

      // CORRECCIÓN DEL ENLACE DE REGRESO DE FORMSUBMIT:
      // Utiliza automáticamente la URL pública actual de la web.

      window.scrollTo(0, 0);
    }

    document.getElementById('year').textContent =
      new Date().getFullYear();

    window.addEventListener('hashchange', render);

    render();

  </script>
</body>
</html>
